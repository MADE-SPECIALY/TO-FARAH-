<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Bouquet 3D</title>
<style>
:root{--bg:#000;--panel:#12121a;--fg:#d4d4d4;--kw:#c586c0;--cm:#6a9955;--red:#ff4660;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#000}}
:root[data-theme="dark"]{--bg:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace;display:flex;justify-content:center}
.wrap{width:100%;max-width:480px;position:relative}
canvas{display:block;width:100%;height:auto;background:var(--bg)}
.hud{position:absolute;top:10px;right:14px;color:var(--red);font-size:12px}
.code{background:var(--panel);margin:0;padding:14px;font-size:12px;line-height:1.5;height:300px;overflow:hidden;white-space:pre;position:relative}
.kw{color:var(--kw)}.cm{color:var(--cm)}
.cur{display:inline-block;width:7px;height:13px;background:#ddd;vertical-align:-2px;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
button{position:absolute;bottom:12px;background:#222;color:#eee;border:1px solid #444;border-radius:8px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="1080" height="1188"></canvas>
  <pre class="code" id="code"></pre>
  <button id="re" style="right:12px">↻ replay</button>
</div>
<script>
(function(){
var W=1080,CW=12,CH=18,COLS=90,ROWS=66,GROUND=58,S=520,DUR=22,RAMP=" .,:;-=+*#%@",PI=Math.PI,PITCH=0.38,CP=Math.cos(PITCH),SP=Math.sin(PITCH);
var cv=document.getElementById("c"),ctx=cv.getContext("2d"),codeEl=document.getElementById("code");
function sm(a,b,x){var t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);}
var seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
var SPK=[];for(var i=0;i<160;i++)SPK.push([rnd()*1.8-0.9,rnd()*1.7+0.2,rnd()*1.5+0.5,rnd()*6.28,"+*."[Math.floor(rnd()*3)]]);
// bouquet layout: type, position, size
var FL=[["r",0,1.30,0,0.62],["r",-0.38,1.12,0.18,0.56],["r",0.34,1.08,-0.2,0.56],
["t",-0.2,1.22,-0.3,1],["t",0.3,1.24,0.3,1],["t",0.02,1.02,0.44,1],
["l",-0.52,0.95,-0.12,1],["l",0.54,0.93,0.08,1],["l",0.08,1.0,-0.52,1]];
FL.forEach(function(f){var n=Math.sqrt(f[1]*f[1]+f[2]*f[2]+f[3]*f[3]);f.d=[f[1]/n,f[2]/n,f[3]/n];
  var d=f.d,u=[d[1]*1-d[2]*0,d[2]*0-d[0]*1,d[0]*0-d[1]*0];var un=Math.sqrt(u[0]*u[0]+u[1]*u[1]+u[2]*u[2]);f.u=[u[0]/un,u[1]/un,u[2]/un];
  f.w=[d[1]*f.u[2]-d[2]*f.u[1],d[2]*f.u[0]-d[0]*f.u[2],d[0]*f.u[1]-d[1]*f.u[0]];});
var CODE=["# bouquet.py — roses, lilies, tulips in 3D","import numpy as np","",
"FLOWERS = [rose]*3 + [tulip]*3 + [lily]*3","",
"def rose(b, s):","    # 14 petals on a golden-angle spiral","    a = i*2.39996 + u*halfwidth","    lean = lc + bi*(.1 + 1.05*f**1.1)","    return (r*cos(a), y, r*sin(a))","",
"def tulip(b, s):","    # 6 petals closing into a cup","    r = Rt * sin(pi*(.14+.76*v))**.6","",
"def lily(b, s):","    # 6 tepals that curl back as they open","    lean = .25 + b*(.7 + .9*v*v)","",
"def bouquet(t):","    for f in FLOWERS:","        stem(origin, f.pos)","        f.draw(smooth(t))","    wrap_paper(); ribbon()","    return ascii(zbuffer)"].join("\n");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function colorLine(l){if(l.trim().charAt(0)==="#")return '<span class="cm">'+esc(l)+'</span>';return esc(l).replace(/^(\s*)(def|import|return|for)\b/,'$1<span class="kw">$2</span>');}
var LINES=CODE.split("\n");
function drawCode(t){var n=Math.max(1,Math.floor(Math.min(1,t/(DUR*0.6))*LINES.length)),vis=LINES.slice(Math.max(0,n-17),n);codeEl.innerHTML=vis.map(colorLine).join("\n")+'<span class="cur"></span>';}
function frame(t){
  var N=COLS*ROWS,dep=new Float32Array(N).fill(-1e9),ch=new Array(N),col=new Array(N);
  var spin=0.35*t+0.7*Math.max(0,t-11),cs=Math.cos(spin),sn=Math.sin(spin);
  function P(x,y,z,m,rgb,mn){
    var xr=x*cs+z*sn,zr=-x*sn+z*cs,ys=y*CP-zr*SP,d=zr*CP+y*SP;
    var c=Math.floor((W/2+xr*S)/CW),r=Math.floor(GROUND-ys*S/CH);
    if(c<0||c>=COLS||r<0||r>=ROWS)return;
    var k=r*COLS+c;if(d<=dep[k])return;dep[k]=d;
    m=Math.min(1,Math.max(0.55,m*1.15));
    ch[k]=RAMP.charAt(Math.min(11,Math.max(mn,Math.floor(m*11.99))));
    var q=0.75+0.25*m;col[k]="rgb("+(rgb[0]*q|0)+","+(rgb[1]*q|0)+","+(rgb[2]*q|0)+")";
  }
  // wrapping paper + ribbon
  var gc=sm(0.2,2,t),Hc=0.55*gc;
  for(var y=0;y<=Hc;y+=0.012){var rc=0.03+0.3*(y/0.55);for(var a=0;a<6.28;a+=0.05){
    var rib=Math.abs(y-0.4)<0.03&&Hc>0.42;
    P(rc*Math.cos(a),y,rc*Math.sin(a),rib?0.85:0.42+0.35*Math.cos(a+spin-0.6),rib?[255,110,160]:[205,165,115],rib?5:2);}}
  // leaves (greenery from the paper rim)
  function leaf(phi,L,Wd,e0,e1,g,rgb,r0,ya){
    if(g<=0)return;var cp=Math.cos(phi),sp=Math.sin(phi),K=30,U=12,rr=r0,yy=ya;
    for(var k=0;k<=K;k++){var s=k/K,e=e0+(e1-e0)*s,w=Wd*g*Math.sin(PI*(0.04+0.96*s))*(1-0.25*s);
      for(var ui=0;ui<=U;ui++){var u=-1+2*ui/U;
        P(cp*rr-sp*u*w,yy-Math.abs(u)*w*0.4,sp*rr+cp*u*w,(0.4+0.4*(1-Math.abs(u)))*(0.85+0.2*Math.cos(phi+spin)),rgb,2);}
      rr+=L*g/K*Math.cos(e);yy+=L*g/K*Math.sin(e);}
  }
  for(var j=0;j<7;j++)leaf(j*0.898+0.3,0.62,0.1,1.0,-0.1,sm(2+0.2*j,5+0.2*j,t)*gc,[50+j*4|0,185,70],0.2,0.45);
  FL.forEach(function(f,i){
    var px=f[1],py=f[2],pz=f[3],gs=sm(0.3+0.2*i,3.8+0.2*i,t);
    for(var s=0;s<=gs;s+=0.005)for(var a=0;a<3;a++){var o=0.011*Math.cos(a*2.1+spin),o2=0.011*Math.sin(a*2.1);
      P(px*s+o,py*s,pz*s+o2,0.5+0.4*Math.cos(a*2.1+spin),[60,210,80],3);}
    var hs=sm(2.6+0.35*i,4.8+0.35*i,t)*(gs>0.97?1:0),b=sm(4.5+0.4*i,12+0.4*i,t);
    if(hs<=0)return;
    function F(lx,ly,lz,m,rgb,mn){P(px+lx*f.u[0]+ly*f.d[0]+lz*f.w[0],py+lx*f.u[1]+ly*f.d[1]+lz*f.w[1],pz+lx*f.u[2]+ly*f.d[2]+lz*f.w[2],m,rgb,mn);}
    if(f[0]==="r"){
      var sc=f[4]*hs,NP=14,K2=12,U2=15;
      for(var i2=0;i2<NP;i2++){
        var q=i2/(NP-1),bi=sm((1-q)*0.3,(1-q)*0.3+0.65,b),H=(0.11+0.27*q)*sc,r0=(0.012+0.09*q)*sc,hw=1.2-0.3*q,lc=0.1+0.3*q,ph=i2*2.39996,y0=(1-q)*0.04*sc;
        for(var ui=0;ui<=U2;ui++){var u=-1+2*ui/U2,rr=r0,yy=y0;
          for(var k=0;k<=K2;k++){var v=k/K2,ang=ph+u*hw*Math.pow(Math.sin(PI*(0.1+0.8*v)),0.45);
            var lean=lc+bi*(0.1+1.05*Math.pow(q,1.1))+bi*(0.15+0.7*q)*Math.pow(v,2.5)+0.35*bi*u*u*v;
            rr+=H/K2*Math.sin(lean);yy+=H/K2*Math.cos(lean);
            var tt=Math.min(1,v*v*(0.3+0.5*q)+Math.pow(Math.abs(u),4)*0.25);
            F(rr*Math.cos(ang),yy+0.012*bi*Math.sin(6*u+i2)*v,rr*Math.sin(ang),(0.45+0.55*Math.min(1,v*1.5))*(0.82+0.18*Math.sin(3*u+i2*1.7))*(0.85+0.2*Math.cos(ang+spin)),[170+85*tt|0,12+85*tt|0,35+85*tt|0],5);}}}
    }else if(f[0]==="t"){
      for(var k3=0;k3<6;k3++){var ph3=k3*1.0472+(k3%2?0.52:0),Rt=(k3%2?0.085:0.1)*hs;
        for(var ui2=0;ui2<=12;ui2++){var u2=-1+2*ui2/12;
          for(var k4=0;k4<=14;k4++){var v2=k4/14,sh=Math.pow(Math.sin(PI*(0.1+0.8*v2)),0.45),an=ph3+u2*0.95*sh;
            var r=Rt*Math.pow(Math.sin(PI*(0.14+0.76*v2)),0.6)*(1+0.35*b*v2*v2)+0.01*hs,tt2=v2*v2*0.75+Math.pow(Math.abs(u2),4)*0.2;
            F(r*Math.cos(an),0.32*hs*v2*(1-0.12*b*v2),r*Math.sin(an),(0.55+0.45*v2)*(0.85+0.15*Math.sin(3*u2+k3))*(0.85+0.2*Math.cos(an+spin)),[255,215-100*tt2|0,60-30*tt2|0],5);}}}
    }else{
      for(var k5=0;k5<6;k5++){var ph5=k5*1.0472+(k5%2?0.52:0),H5=0.4*hs,rr5=0.01,yy5=0;
        for(var k6=0;k6<=16;k6++){var v3=k6/16,lean5=0.25+b*(0.7+0.9*v3*v3);rr5+=H5/16*Math.sin(lean5);yy5+=H5/16*Math.cos(lean5);
          var w5=0.11*hs*Math.pow(Math.sin(PI*(0.03+0.9*v3)),0.8)*(k5%2?1.15:1);
          for(var ui3=0;ui3<=8;ui3++){var u3=-1+2*ui3/8,spk=Math.sin(k6*5+ui3*7+k5)>0.85&&v3<0.6&&Math.abs(u3)<0.6,mid=1-Math.abs(u3);
            F(rr5*Math.cos(ph5)-Math.sin(ph5)*u3*w5,yy5-Math.abs(u3)*w5*0.5,rr5*Math.sin(ph5)+Math.cos(ph5)*u3*w5,(0.62+0.38*mid)*(0.85+0.2*Math.cos(ph5+spin)),spk?[170,40,90]:[255-20*mid-40*(1-v3)*mid|0,235-110*mid*(1-v3)|0,235-60*mid*(1-v3)|0],5);}}
        var aj=ph5+0.2;for(var tq=0;tq<=1;tq+=0.07)F(Math.cos(aj)*0.13*hs*tq*(0.4+0.6*b),0.04*hs+0.3*hs*tq,Math.sin(aj)*0.13*hs*tq*(0.4+0.6*b),0.8,[200,230,120],4);
        F(Math.cos(aj)*0.13*hs*(0.4+0.6*b),0.34*hs,Math.sin(aj)*0.13*hs*(0.4+0.6*b),1,[255,140,20],8);}
    }
  });
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,cv.height);
  ctx.font="bold 17px 'DejaVu Sans Mono',Menlo,Consolas,monospace";ctx.textBaseline="alphabetic";
  for(var qi=0;qi<N;qi++){if(!ch[qi])continue;ctx.fillStyle=col[qi];ctx.fillText(ch[qi],(qi%COLS)*CW,Math.floor(qi/COLS)*CH+14);}
  if(t>3)for(var s2=0;s2<SPK.length;s2++){var e=SPK[s2],tw=Math.sin(t*e[2]*2+e[3]);
    if(tw>0.7){ctx.fillStyle="rgba(255,235,240,"+((tw-0.7)/0.3).toFixed(2)+")";ctx.fillText(e[4],W/2+e[0]*S*1.2,GROUND*CH-(e[1]+0.04*(t%6))*S);}}
  ctx.fillStyle="#888";ctx.font="14px 'DejaVu Sans Mono',Menlo,Consolas,monospace";ctx.fillText("@yourname · bouquet.html",30,GROUND*CH+60);
}
var start=performance.now();
function loop(now){var t=(now-start)/1000;frame(t);drawCode(t);requestAnimationFrame(loop);}






document.getElementById("re").addEventListener("click",function(){start=performance.now();});
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
